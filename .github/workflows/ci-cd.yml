name: CI/CD Pipeline

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["main", "master"]

jobs:
  # ──────────────────────────────────────────────────────
  # Job 1: Build, Test & Analyze Spring Boot Backend
  # ──────────────────────────────────────────────────────
  backend:
    name: Backend - Build, Test & SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          cache: 'maven'
          distribution: 'temurin'

      - name: Build & Test
        run: mvn clean package
        working-directory: ./backend

      - name: SonarCloud Analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.token=${{ secrets.SONAR_TOKEN }} -Dsonar.scanner.skipJreProvisioning=true
        working-directory: ./backend

      - name: Upload backend artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-jar
          path: ./backend/target/*.jar

  # ──────────────────────────────────────────────────────
  # Job 2: Build, Test & Analyze Next.js Frontend
  # ──────────────────────────────────────────────────────
  frontend:
    name: Frontend - Lint, Build & SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'frontend/package-lock.json'

      - name: Install dependencies
        run: npm ci
        working-directory: ./frontend

      - name: Lint Next.js app
        run: npm run lint
        working-directory: ./frontend

      - name: Build production bundle
        env:
          RESEND_API_KEY: "re_build_dummy_key"
          NEXT_PUBLIC_SUPABASE_URL: "https://dummy.supabase.co"
          NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy-key"
          SUPABASE_SERVICE_ROLE_KEY: "dummy-key"
        run: npm run build
        working-directory: ./frontend

      - name: SonarCloud Analysis
        uses: SonarSource/sonarcloud-github-action@v3
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-build
          path: ./frontend/.next

  # ──────────────────────────────────────────────────────
  # Job 3: Build Docker Images, Trivy Scan & Push
  # ──────────────────────────────────────────────────────
  docker:
    name: Docker Build, Trivy Scan & Push
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # ── Build Docker images (multi-stage) ──────────
      - name: Build backend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dbm-backend:latest

      - name: Build frontend Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: false
          load: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dbm-frontend:latest

      # ── Trivy Security Scanning ────────────────────
      - name: Trivy - Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/dbm-backend:latest
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      - name: Trivy - Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ secrets.DOCKERHUB_USERNAME }}/dbm-frontend:latest
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # ── Push to Docker Hub ─────────────────────────
      - name: Push backend image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dbm-backend:latest

      - name: Push frontend image to Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/dbm-frontend:latest

  # ──────────────────────────────────────────────────────
  # Job 4: Continuous Deployment to Azure Cloud VPS
  # ──────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production (Azure Cloud)
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Copy docker-compose.prod.yml to Server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "docker-compose.prod.yml"
          target: "/opt/dbm-app"

      - name: Deploy application via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          envs: SERVER_HOST
          script: |
            cd /opt/dbm-app
            export SERVER_HOST="${{ secrets.SERVER_HOST }}"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --remove-orphans

